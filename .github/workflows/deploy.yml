name: Deploy Odysseus

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: odysseus
          POSTGRES_PASSWORD: odysseus
          POSTGRES_DB: odysseus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odysseus -d odysseus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: pip install -r api/requirements.txt

      - name: Run Backend Tests
        working-directory: api
        env:
          ODYSSEUS_TEST_DATABASE_URL: postgresql+psycopg://odysseus:odysseus@localhost:5432/odysseus
        run: python -m pytest

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test and Build Frontend
        working-directory: web
        run: npm ci && npm test && npm run build

  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, gaia]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: registry.tienzo.net
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_RAW_PASSWORD }}

      - name: Validate Required Configuration
        env:
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          REGISTRY_PREFIX: ${{ vars.REGISTRY_PREFIX }}
          ODYSSEUS_DB_PASSWORD: ${{ secrets.ODYSSEUS_DB_PASSWORD }}
          ODYSSEUS_MCP_TOKEN: ${{ secrets.ODYSSEUS_MCP_TOKEN }}
          ODYSSEUS_INTEGRATION_TOKEN: ${{ secrets.ODYSSEUS_INTEGRATION_TOKEN }}
          IMMICH_API_KEY: ${{ secrets.IMMICH_API_KEY }}
        run: |
          MISSING=""
          [ -z "$DOMAIN_NAME" ] && MISSING="$MISSING DOMAIN_NAME"
          [ -z "$REGISTRY_PREFIX" ] && MISSING="$MISSING REGISTRY_PREFIX"
          [ -z "$ODYSSEUS_DB_PASSWORD" ] && MISSING="$MISSING ODYSSEUS_DB_PASSWORD"
          [ -z "$ODYSSEUS_MCP_TOKEN" ] && MISSING="$MISSING ODYSSEUS_MCP_TOKEN"
          [ -z "$ODYSSEUS_INTEGRATION_TOKEN" ] && MISSING="$MISSING ODYSSEUS_INTEGRATION_TOKEN"
          [ -z "$IMMICH_API_KEY" ] && MISSING="$MISSING IMMICH_API_KEY"
          if [ -n "$MISSING" ]; then
            echo "::error::Deployment halted: missing required configuration:$MISSING" >&2
            exit 1
          fi

      - name: Setup Secrets
        env:
          ODYSSEUS_DB_PASSWORD: ${{ secrets.ODYSSEUS_DB_PASSWORD }}
          ODYSSEUS_MCP_TOKEN: ${{ secrets.ODYSSEUS_MCP_TOKEN }}
          ODYSSEUS_INTEGRATION_TOKEN: ${{ secrets.ODYSSEUS_INTEGRATION_TOKEN }}
          IMMICH_API_KEY: ${{ secrets.IMMICH_API_KEY }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/yggdrasil-lab/yggdrasil-os/main/deploy/ensure_secret.sh -o /tmp/ensure_secret.sh
          chmod +x /tmp/ensure_secret.sh
          echo "ODYSSEUS_DB_PASSWORD_NAME=$(printf '%s' "$ODYSSEUS_DB_PASSWORD" | /tmp/ensure_secret.sh odysseus_db_password)" >> $GITHUB_ENV
          echo "ODYSSEUS_MCP_TOKEN_NAME=$(printf '%s' "$ODYSSEUS_MCP_TOKEN" | /tmp/ensure_secret.sh odysseus_mcp_token)" >> $GITHUB_ENV
          echo "ODYSSEUS_INTEGRATION_TOKEN_NAME=$(printf '%s' "$ODYSSEUS_INTEGRATION_TOKEN" | /tmp/ensure_secret.sh odysseus_integration_token)" >> $GITHUB_ENV
          echo "IMMICH_API_KEY_NAME=$(printf '%s' "$IMMICH_API_KEY" | /tmp/ensure_secret.sh immich_api_key)" >> $GITHUB_ENV

      - name: Prepare host data directories
        env:
          ODYSSEUS_DB_MOUNT_PATH: ${{ vars.ODYSSEUS_DB_MOUNT_PATH }}
          ODYSSEUS_MAPPACKS_MOUNT_PATH: ${{ vars.ODYSSEUS_MAPPACKS_MOUNT_PATH }}
        run: |
          DB_DIR="${ODYSSEUS_DB_MOUNT_PATH:-/opt/odysseus/data}"
          MAPPACKS_DIR="${ODYSSEUS_MAPPACKS_MOUNT_PATH:-/opt/odysseus/mappacks}"
          docker run --rm -v "${DB_DIR}":/data -v "${MAPPACKS_DIR}":/mappacks alpine sh -c "mkdir -p /data /mappacks && chown 1000:1000 /mappacks"

      - name: Build and Deploy with Docker Compose
        env:
          REGISTRY_PREFIX: ${{ vars.REGISTRY_PREFIX }}
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          TZ: ${{ vars.TZ || 'Pacific/Auckland' }}
          ODYSSEUS_DB_MOUNT_PATH: ${{ vars.ODYSSEUS_DB_MOUNT_PATH || '/opt/odysseus/data' }}
          ODYSSEUS_MAPPACKS_MOUNT_PATH: ${{ vars.ODYSSEUS_MAPPACKS_MOUNT_PATH || '/opt/odysseus/mappacks' }}
          PLUTUS_API_URL: ${{ vars.PLUTUS_API_URL || 'http://plutus-api:8000' }}
          CHRONOS_API_URL: ${{ vars.CHRONOS_API_URL || 'http://chronos-api:8000' }}
          IMMICH_API_URL: ${{ vars.IMMICH_API_URL || 'http://immich-server:2283' }}
          IMAGE_TAG: odysseus
        run: |
          curl -fsSL https://raw.githubusercontent.com/yggdrasil-lab/yggdrasil-os/main/deploy/deploy.sh -o /tmp/deploy.sh
          chmod +x /tmp/deploy.sh
          /tmp/deploy.sh "odysseus" docker-compose.yml

      - name: Verify Post-Deploy Swarm Convergence
        run: |
          curl -fsSL https://raw.githubusercontent.com/yggdrasil-lab/yggdrasil-os/main/deploy/verify_convergence.sh -o /tmp/verify_convergence.sh
          chmod +x /tmp/verify_convergence.sh
          /tmp/verify_convergence.sh "odysseus" odysseus_odysseus-db odysseus_odysseus-api odysseus_odysseus-web
